name: PostPulse Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  frontend-ci:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript & ESLint Check
        run: npm run lint

      - name: Run Frontend Tests
        run: npx vitest run --passWithNoTests

      - name: Build Production Frontend Assets
        run: npm run build

  backend-ci:
    name: Spring Boot 3 & Maven Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Maven Verification
        working-directory: ./backend
        run: mvn clean verify -DskipTests=false -B

      - name: Package Spring Boot Executable JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

  docker-validation:
    name: Validate Multi-Stage Docker Builds
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: postpulse/backend:ci-check

      - name: Build Frontend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: postpulse/frontend:ci-check
