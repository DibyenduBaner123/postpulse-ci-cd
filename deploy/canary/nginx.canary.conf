# PostPulse Canary Traffic Router Configuration
# Implements weighted traffic splitting between stable and canary backends

upstream postpulse_backend {
    # Default initial split: 90% Stable, 10% Canary
    server backend-stable:3000 weight=90 max_fails=3 fail_timeout=10s;
    server backend-canary:3000 weight=10 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Static frontend assets
    root /usr/share/nginx/html;
    index index.html;

    # Expose router metrics & active upstream target in response headers
    add_header X-Proxy-Router "PostPulse-Canary-Engine/1.0" always;

    # API traffic reverse proxy with weighted upstream distribution
    location /api/ {
        proxy_pass http://postpulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Expose upstream server address for observability and test scripts
        add_header X-Upstream-Backend $upstream_addr always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for the router itself
    location /healthz {
        access_log off;
        return 200 '{"router": "healthy", "mode": "canary-weighted"}';
        add_header Content-Type application/json;
    }
}
