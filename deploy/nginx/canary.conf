# ====================================================================
# PostPulse Nginx Canary Traffic Split Configuration
# ====================================================================

# Configurable Upstream Weighted Split
# Controlled via canary-promote.sh and canary-rollback.sh
upstream postpulse_backend_upstream {
    # STABLE: Active production release (Default 90%)
    server backend-stable:8080 weight=90 max_fails=3 fail_timeout=10s;

    # CANARY: Staged experimental release (Default 10%)
    server backend-canary:8080 weight=10 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Performance Tuning
    client_max_body_size 25M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;

    # Correlation ID generation if missing
    set $corr_id $http_x_correlation_id;
    if ($corr_id = "") {
        set $corr_id $request_id;
    }

    # API Proxy Routing through Canary Upstream
    location /api/ {
        proxy_pass http://postpulse_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $corr_id;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Track which backend handled the request
        add_header X-Upstream-Backend $upstream_addr always;
        add_header X-Correlation-Id $corr_id always;
    }

    # Actuator Health Probe
    location /actuator/health {
        proxy_pass http://postpulse_backend_upstream/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $corr_id;
    }

    # Frontend SPA Proxy
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
